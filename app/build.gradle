plugins { id 'com.android.application' }
android {
    namespace 'com.yael.italy2026'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yael.italy2026'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        trip {
            storeFile file('italy2026.keystore')
            storePassword 'italy2026'
            keyAlias 'italy2026'
            keyPassword 'italy2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.trip }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
